name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ANYSEARCH_ENABLED: "false"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Ruff check
        run: python -m ruff check .

      - name: Run Ruff format check
        run: >
          python -m ruff format --check
          src/tw_quant/backtest/engine.py
          src/tw_quant/trading/costs.py
          src/tw_quant/trading/pending.py
          tests/test_backtest.py
          tests/test_trading_costs.py
          tests/test_github_actions.py
          tests/test_pending_orders.py

      - name: Run tests
        run: python -m pytest -q
