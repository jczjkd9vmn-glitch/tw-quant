name: Daily Taiwan Stock Paper Trading

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. 12:30 UTC = 20:30 Asia/Taipei.
    - cron: "30 12 * * *"

permissions:
  contents: read

concurrency:
  group: github-pages-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    outputs:
      docs_written: ${{ steps.public_report.outputs.docs_written }}
      docs_publish_status: ${{ steps.public_report.outputs.docs_publish_status }}
      docs_publish_reason: ${{ steps.public_report.outputs.docs_publish_reason }}
      report_requested_date: ${{ steps.public_report.outputs.requested_date }}
      report_trade_date: ${{ steps.public_report.outputs.trade_date }}
      report_actual_data_date: ${{ steps.public_report.outputs.actual_data_date }}
      report_trading_day_lag: ${{ steps.public_report.outputs.trading_day_lag }}
      report_freshness_source: ${{ steps.public_report.outputs.freshness_source }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Backfill recent trading data
        run: python scripts/backfill.py --days 45 --timeout 30 --retries 3 --sleep 1

      - name: Fetch multi-factor data
        run: python scripts/fetch_multi_factor_data.py

      - name: Run daily paper trading workflow
        run: python scripts/run_all_daily.py --capital 1000000 --allow-fallback-latest

      - name: Generate Traditional Chinese HTML report and keep previous public docs if stale
        run: python scripts/generate_html_report.py

      - name: Inspect public report publish status
        id: public_report
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          status_path = Path("reports/public_report_publish_status.csv")
          if not status_path.exists():
              raise SystemExit("missing reports/public_report_publish_status.csv")

          rows = list(csv.DictReader(status_path.open(encoding="utf-8")))
          if not rows:
              raise SystemExit("reports/public_report_publish_status.csv has no rows")

          row = rows[-1]
          docs_written = str(row.get("docs_written", "")).strip().lower() in {"true", "1", "yes"}
          docs_publish_status = row.get("docs_publish_status", "UNKNOWN")
          docs_publish_reason = row.get("docs_publish_reason", "")
          requested_date = row.get("requested_date", "")
          trade_date = row.get("trade_date", "")
          actual_data_date = row.get("actual_data_date", "")
          trading_day_lag = row.get("trading_day_lag", "")
          freshness_source = row.get("freshness_source", "")

          print(f"public_report.docs_written={docs_written}")
          print(f"public_report.docs_publish_status={docs_publish_status}")
          print(f"public_report.docs_publish_reason={docs_publish_reason}")
          print(f"public_report.requested_date={requested_date}")
          print(f"public_report.trade_date={trade_date}")
          print(f"public_report.actual_data_date={actual_data_date}")
          print(f"public_report.market_closed={row.get('market_closed', '')}")
          print(f"public_report.trading_day_lag={trading_day_lag}")
          print(f"public_report.freshness_source={freshness_source}")
          print(f"public_report.used_latest_available={row.get('used_latest_available', '')}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"docs_written={'true' if docs_written else 'false'}", file=output)
              print(f"docs_publish_status={docs_publish_status}", file=output)
              print(f"docs_publish_reason={docs_publish_reason}", file=output)
              print(f"requested_date={requested_date}", file=output)
              print(f"trade_date={trade_date}", file=output)
              print(f"actual_data_date={actual_data_date}", file=output)
              print(f"trading_day_lag={trading_day_lag}", file=output)
              print(f"freshness_source={freshness_source}", file=output)
          PY

      - name: Commit updated data and reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ docs/
          if git diff --cached --quiet; then
            echo "No data or report changes to commit."
          else
            git commit -m "chore: update daily quant data and reports"
            git push
          fi

      - name: Configure GitHub Pages
        if: steps.public_report.outputs.docs_written == 'true' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.public_report.outputs.docs_written == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Log skipped GitHub Pages deploy for stale public docs
        if: steps.public_report.outputs.docs_written != 'true'
        run: |
          echo "GitHub Pages deploy skipped because public docs were not updated."
          echo "status=${{ steps.public_report.outputs.docs_publish_status }}"
          echo "reason=${{ steps.public_report.outputs.docs_publish_reason }}"

      - name: Log skipped GitHub Pages deploy outside main
        if: steps.public_report.outputs.docs_written == 'true' && github.ref != 'refs/heads/main'
        run: echo "GitHub Pages deploy skipped because this workflow is not running on refs/heads/main."

      - name: Send daily notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/send_daily_notification.py

  deploy-pages:
    needs: daily
    if: needs.daily.outputs.docs_written == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed GitHub Pages report
        if: needs.daily.outputs.docs_written == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          REPORT_REQUESTED_DATE: ${{ needs.daily.outputs.report_requested_date }}
          REPORT_TRADE_DATE: ${{ needs.daily.outputs.report_trade_date }}
          REPORT_ACTUAL_DATA_DATE: ${{ needs.daily.outputs.report_actual_data_date }}
          REPORT_TRADING_DAY_LAG: ${{ needs.daily.outputs.report_trading_day_lag }}
          REPORT_FRESHNESS_SOURCE: ${{ needs.daily.outputs.report_freshness_source }}
        run: |
          set -u

          max_attempts=8
          sleep_seconds=12

          if [ -z "${PAGES_URL}" ]; then
            echo "Smoke test failed before retry: deployment page_url is empty."
            exit 1
          fi

          base_url="${PAGES_URL%/}/"
          expected_terms=("台股" "紙上交易" "實際交易日")
          source_terms=("freshness_source" "資料來源")
          lag_terms=("trading_day_lag" "落後有效交易日")
          expected_dates=()

          for value in "${REPORT_REQUESTED_DATE}" "${REPORT_TRADE_DATE}" "${REPORT_ACTUAL_DATA_DATE}"; do
            if [ -n "${value}" ] && [ "${value}" != "-" ]; then
              expected_dates+=("${value}")
            fi
          done

          contains_any() {
            local file="$1"
            shift
            local term
            for term in "$@"; do
              if grep -Fq "${term}" "${file}"; then
                return 0
              fi
            done
            return 1
          }

          echo "Smoke test target URL=${base_url}"
          echo "Expected freshness: requested_date=${REPORT_REQUESTED_DATE}; trade_date=${REPORT_TRADE_DATE}; actual_data_date=${REPORT_ACTUAL_DATA_DATE}; trading_day_lag=${REPORT_TRADING_DAY_LAG}; freshness_source=${REPORT_FRESHNESS_SOURCE}"

          for attempt in $(seq 1 "${max_attempts}"); do
            body_file="$(mktemp)"
            error_file="$(mktemp)"
            smoke_url="${base_url}?smoke=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            failure_reason=""

            echo "Smoke test attempt ${attempt}/${max_attempts}"
            echo "URL=${smoke_url}"

            http_status="$(curl -L --silent --show-error --connect-timeout 10 --max-time 30 -o "${body_file}" -w "%{http_code}" "${smoke_url}" 2>"${error_file}")"
            curl_exit=$?
            echo "HTTP status=${http_status}"

            if [ "${curl_exit}" -ne 0 ]; then
              failure_reason="curl failed with exit ${curl_exit}: $(cat "${error_file}")"
            elif [ "${http_status}" != "200" ]; then
              failure_reason="expected HTTP status 200 but got ${http_status}"
            else
              for term in "${expected_terms[@]}"; do
                if ! grep -Fq "${term}" "${body_file}"; then
                  failure_reason="response body is missing required report keyword: ${term}"
                  break
                fi
              done

              if [ -z "${failure_reason}" ] && ! contains_any "${body_file}" "${source_terms[@]}"; then
                failure_reason="response body is missing freshness source label: freshness_source or 資料來源"
              fi

              if [ -z "${failure_reason}" ] && ! contains_any "${body_file}" "${lag_terms[@]}"; then
                failure_reason="response body is missing trading-day lag label: trading_day_lag or 落後有效交易日"
              fi

              if [ -z "${failure_reason}" ]; then
                for expected_date in "${expected_dates[@]}"; do
                  if ! grep -Fq "${expected_date}" "${body_file}"; then
                    failure_reason="response body is missing expected freshness date: ${expected_date}"
                    break
                  fi
                done
              fi
            fi

            if [ -z "${failure_reason}" ]; then
              echo "Smoke test passed on attempt ${attempt}/${max_attempts}."
              rm -f "${body_file}" "${error_file}"
              exit 0
            fi

            echo "Failure reason: ${failure_reason}"
            rm -f "${body_file}" "${error_file}"

            if [ "${attempt}" -lt "${max_attempts}" ]; then
              echo "Retrying in ${sleep_seconds} seconds..."
              sleep "${sleep_seconds}"
            fi
          done

          echo "Smoke test failed after ${max_attempts} attempts."
          exit 1
