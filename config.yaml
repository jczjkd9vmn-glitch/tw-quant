database:
  url: sqlite:///data/tw_quant.sqlite

data:
  market: TSE
  request_timeout_seconds: 15
  stop_on_data_anomaly: true
  twse_url: https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX

strategy:
  minimum_total_score: 70
  min_history_days: 40
  max_candidates: 20
  weights:
    trend: 0.30
    momentum: 0.25
    fundamental: 0.15
    chip: 0.15
    risk: 0.15

risk:
  initial_equity: 1000000
  max_position_pct: 0.10
  max_portfolio_exposure_pct: 0.60
  max_trade_risk_pct: 0.01
  default_stop_loss_pct: 0.08
  min_liquidity_value: 5000000
  max_volatility_20: 0.08

trading_cost:
  commission_rate: 0.000399
  min_commission: 1
  sell_tax_rate_stock: 0.003
  sell_tax_rate_etf: 0.001
  sell_tax_rate_bond_etf: 0.0
  slippage_rate: 0.001

exit_strategy:
  take_profit_1_pct: 0.08
  take_profit_1_sell_pct: 0.50
  take_profit_2_pct: 0.15
  take_profit_2_sell_pct: 0.50
  trailing_stop_activate_pct: 0.08
  trailing_stop_drawdown_pct: 0.08
  ma_exit_window: 20
  max_holding_days: 30
  min_profit_for_holding: 0.03

multi_factor:
  enabled: true
  affect_ranking: false
  affect_risk_pass: false
  block_on_high_risk_event: true
  missing_data_score: 0

market_intel:
  enabled: true
  provider: real
  cache_enabled: true
  affect_ranking: false
  affect_trading: false
  enable_market_intel_filter: false
  provider_order: [official_events, material_events, attention_disposition, csv_fallback, mock]
  allow_mock: true
  mock_only_when_no_real_data: true

data_sources:
  monthly_revenue:
    enabled: true
    lookback_months: 6
    allow_existing_csv_fallback: true
  valuation:
    enabled: true
    allow_existing_csv_fallback: true
  financials:
    enabled: true
    allow_existing_csv_fallback: true
  material_events:
    enabled: true
    allow_existing_csv_fallback: true
  confidence:
    enabled: true
    stale_days_threshold: 90

local_factors:
  liquidity:
    enabled: true
    window: 20
    low_turnover_threshold: 5000000
  sector_strength:
    enabled: true
    short_window: 5
    long_window: 20
    fallback_to_market_relative: true
  holding_risk_light:
    enabled: true
    near_stop_loss_pct: 0.03

event_risk:
  block_disposition_stock: true
  block_attention_stock: false

auto_trading:
  enabled: false
  mode: paper_only
  require_manual_approval: true
  can_place_real_orders: false
  max_position_pct: 0.10
  max_daily_new_positions: 3
  max_daily_loss_pct: 0.03
  max_open_positions: 10
  kill_switch: true

decision_engine:
  enabled: true
  output_advisory_only: true
  default_can_auto_trade: false
  min_confidence_for_buy_candidate: 60
  min_liquidity_for_buy_candidate: 50
  min_grade_for_buy_candidate: B
  block_high_event_risk: true
  block_disposition_stock: true

strategy_validation:
  enabled: true
  lookback_trading_days: 120
  min_trades_required: 10
  benchmark_model: baseline_total_score

backtest:
  initial_cash: 1000000
  top_n: 10
  transaction_cost_bps: 14.25
  max_holding_days: 20
